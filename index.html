<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f7f7f9">
<title>雾白机</title>
<link rel="manifest" href="./manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="雾白机">
<link rel="apple-touch-icon" href="./icon-192.png">
<style id="customFontStyle"></style>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{
  margin:0;padding:0;height:100%;
  background:radial-gradient(120% 90% at 50% 0%,#2a2a32 0%,#141418 55%,#0a0a0c 100%);
  font-family:var(--ui-font, -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;color:#1a1a1c;
}
:root{
  --bg-1:#ffffff;
  --bg-2:#f9f7fa; /* 核心韩系灰白 */
  --bg-3:#f2eff5;
  --ink:#1a1a1c;
  --ink-2:#3a3a3e;
  --ink-3:#8a8a90;
  --ink-4:#c4c4ca;
  --line:rgba(60,60,67,.08);
  --line-2:rgba(60,60,67,.14);
  --accent:#9aa8bb;
  --accent-deep:#6e7d94;
  --accent-soft:rgba(154,168,187,.14);
  --danger:#d97a7a;
  --glass-1:rgba(255,255,255,.55);
  --glass-2:rgba(255,255,255,.75);
  --glass-3:rgba(255,255,255,.92);
  --shadow-1:0 2px 10px -6px rgba(20,20,30,.10);
  --shadow-2:0 10px 28px -16px rgba(20,20,30,.16);
  --shadow-3:0 22px 50px -24px rgba(20,20,30,.24);
  --dock-bottom: 24px;
  --dock-height: 84px;
}
.phone{
  position:relative;
  width:393px;height:852px;
  border-radius:56px;padding:11px;
  background:linear-gradient(155deg,#4a4a52 0%,#1a1a1f 28%,#232329 62%,#3c3c44 100%);
  box-shadow:
    0 0 0 1.5px rgba(255,255,255,.09),
    0 0 0 6px #17171b,
    0 40px 90px -22px rgba(0,0,0,.95),
    0 80px 140px -50px rgba(0,0,0,.8);
}
.dynamic-island{
  position:absolute;top:23px;left:50%;transform:translateX(-50%);
  width:120px;height:33px;border-radius:20px;background:#000;
  z-index:9999;pointer-events:none;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);
}
.screen{
  position:relative;width:100%;height:100%;
  border-radius:46px;overflow:hidden;background:var(--bg-2);
  isolation:isolate;
}
.statusbar{
  position:absolute;top:0;left:0;right:0;height:60px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 30px;font-size:15px;font-weight:600;letter-spacing:.2px;
  z-index:500;pointer-events:none;
  color:var(--ink);
  transition:color .35s ease;
}
.screen[data-mode="app"] .statusbar{color:var(--ink);}
.sb-right{display:flex;align-items:center;gap:6px;}
.sb-right svg{display:block;}

.to-lock-btn{
  position:absolute;
  top:58px;left:50%;
  width:52px;height:24px;
  border-radius:12px;
  background:rgba(255,255,255,.72);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border:1px solid rgba(255,255,255,.9);
  display:grid;place-items:center;
  color:var(--ink-2);
  cursor:pointer;
  z-index:15;
  opacity:0;pointer-events:none;
  transform:translateX(-50%) translateY(-6px);
  transition:opacity .3s ease, transform .3s ease, background .2s;
  box-shadow:var(--shadow-1);
}
.screen[data-mode="home"] .to-lock-btn{
  opacity:.95;pointer-events:auto;
  transform:translateX(-50%) translateY(0);
}
.to-lock-btn:active{background:rgba(255,255,255,.95);transform:translateX(-50%) scale(.92);}
.to-lock-btn svg{width:16px;height:16px;display:block;}

.lockscreen{
  position:absolute;inset:0;z-index:20;
  display:flex;flex-direction:column;align-items:center;
  transition:opacity .5s ease,transform .5s ease,filter .5s ease;
}
.lockscreen.hidden{opacity:0;transform:scale(1.06);filter:blur(8px);pointer-events:none;}
.lock-wall{
  position:absolute;inset:0;
  background: var(--bg-2);
  background-size:cover;background-position:center;
  transition:background-image .35s ease;
}
.lock-content{
  position:relative;margin-top:104px;text-align:center;color:var(--ink);
  z-index:2;
}
.lock-date{font-size:16px;font-weight:500;letter-spacing:.4px;opacity:.75;margin-bottom:6px;}
.lock-time{font-size:88px;font-weight:250;line-height:1.02;letter-spacing:-4px;font-variant-numeric:tabular-nums;color:var(--ink);}
.lock-bottom{
  position:absolute;bottom:0;left:0;right:0;padding-bottom:40px;
  display:flex;flex-direction:column;align-items:center;gap:20px;
  z-index:2;
}
.lock-quick{display:flex;justify-content:space-between;width:100%;padding:0 48px;}
.quick-btn{
  width:52px;height:52px;border-radius:50%;
  background:rgba(255,255,255,.62);
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border:1px solid rgba(255,255,255,.85);
  display:grid;place-items:center;cursor:pointer;color:var(--ink-2);
  box-shadow:var(--shadow-1);
  transition:transform .55s cubic-bezier(.34,1.9,.4,1),background .25s;
}
.quick-btn:active{transform:scale(.86);background:rgba(255,255,255,.85);}
.unlock-hint{
  border:none;background:rgba(255,255,255,.68);
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border:1px solid rgba(255,255,255,.85);
  color:var(--ink);font-size:14px;font-weight:500;letter-spacing:1.2px;
  padding:11px 32px;border-radius:24px;cursor:pointer;
  box-shadow:var(--shadow-2);
  transition:transform .55s cubic-bezier(.34,1.9,.4,1),background .25s;
  animation:breathe 3.6s ease-in-out infinite;
}
.unlock-hint:active{transform:scale(.94);}
@keyframes breathe{0%,100%{opacity:.9;}50%{opacity:1;}}

.lockpwd-overlay{
  position:absolute;inset:0;z-index:9400;
  background:rgba(250,250,252,.72);
  backdrop-filter:blur(40px) saturate(180%);
  -webkit-backdrop-filter:blur(40px) saturate(180%);
  display:flex;flex-direction:column;align-items:center;
  padding-top:96px;
  opacity:0;pointer-events:none;
  transition:opacity .28s ease;
}
.lockpwd-overlay.show{opacity:1;pointer-events:auto;}
.lockpwd-time{
  font-size:64px;font-weight:250;letter-spacing:-3px;
  color:var(--ink);line-height:1;
  font-variant-numeric:tabular-nums;
  min-height:64px;
}
.lockpwd-time:empty{visibility:hidden;}
.lockpwd-title{
  font-size:16px;font-weight:500;
  color:var(--ink-2);
  margin-top:36px;letter-spacing:.3px;
  text-align:center;padding:0 24px;
}
.lockpwd-dots{display:flex;gap:20px;margin-top:26px;padding:6px 0;}
.lockpwd-dot{
  width:13px;height:13px;border-radius:50%;
  border:1.5px solid rgba(30,30,40,.35);
  background:transparent;
  transition:background .18s ease, border-color .18s ease, transform .18s ease;
}
.lockpwd-dot.filled{background:var(--ink);border-color:var(--ink);}
.lockpwd-dots.shake{animation:pwdShake .42s ease;}
@keyframes pwdShake{
  0%,100%{transform:translateX(0);}
  20%{transform:translateX(-10px);}
  40%{transform:translateX(10px);}
  60%{transform:translateX(-8px);}
  80%{transform:translateX(8px);}
}
.lockpwd-keys{
  display:grid;grid-template-columns:repeat(3, 72px);
  gap:14px 14px;margin-top:auto;margin-bottom:14px;
}
.lockpwd-key{
  width:72px;height:72px;border-radius:50%;
  border:1px solid rgba(255,255,255,.85);
  background:rgba(255,255,255,.72);
  color:var(--ink);font:inherit;font-size:26px;font-weight:400;
  cursor:pointer;
  transition:transform .16s ease, background .15s ease;
  display:grid;place-items:center;letter-spacing:.5px;
  box-shadow:var(--shadow-1);
  padding:0;line-height:1;
}
.lockpwd-key:active{transform:scale(.9);background:rgba(255,255,255,.92);}
.lockpwd-key-empty{background:none;border:none;pointer-events:none;visibility:hidden;box-shadow:none;}
.lockpwd-key-del{background:rgba(255,255,255,.55);font-size:22px;}
.lockpwd-bottom{display:flex;gap:6px;justify-content:center;align-items:center;padding-bottom:54px;min-height:50px;}
.lockpwd-bottom button{
  border:none;background:transparent;
  color:var(--ink-2);font:inherit;font-size:14px;font-weight:500;
  padding:10px 22px;border-radius:18px;cursor:pointer;letter-spacing:.3px;
  transition:background .15s ease, color .15s ease;
}
.lockpwd-bottom button:active{background:rgba(120,120,128,.12);color:var(--ink);}

.lockpwd-overlay.panel-variant{
  background:rgba(30,30,40,.24);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  padding-top:0;justify-content:flex-end;
}
.lockpwd-overlay.panel-variant .lockpwd-panel{
  width:100%;
  background:var(--bg-1);
  border-radius:26px 26px 0 0;
  padding:22px 20px calc(30px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -20px 60px -20px rgba(20,20,30,.22);
  transform:translateY(24px);
  transition:transform .34s cubic-bezier(.34,1.2,.4,1);
  display:flex;flex-direction:column;align-items:center;
}
.lockpwd-overlay.panel-variant.show .lockpwd-panel{transform:translateY(0);}
.lockpwd-overlay.panel-variant .lockpwd-title{color:var(--ink);font-size:16px;font-weight:600;letter-spacing:.3px;margin-top:0;margin-bottom:6px;}
.lockpwd-overlay.panel-variant .lockpwd-dots{margin-top:14px;}
.lockpwd-overlay.panel-variant .lockpwd-dot{border-color:rgba(60,60,67,.35);}
.lockpwd-overlay.panel-variant .lockpwd-dot.filled{background:var(--accent-deep);border-color:var(--accent-deep);}
.lockpwd-overlay.panel-variant .lockpwd-keys{grid-template-columns:repeat(3, 64px);gap:12px;margin-top:22px;margin-bottom:0;}
.lockpwd-overlay.panel-variant .lockpwd-key{
  width:64px;height:64px;border:1px solid rgba(60,60,67,.06);
  background:var(--bg-2);color:var(--ink);font-size:22px;font-weight:400;
}
.lockpwd-overlay.panel-variant .lockpwd-key:active{background:var(--bg-3);}
.lockpwd-overlay.panel-variant .lockpwd-key-empty{background:none;border:none;}
.lockpwd-overlay.panel-variant .lockpwd-key-del{background:transparent;color:var(--ink-2);}
.lockpwd-overlay.panel-variant .lockpwd-bottom{padding-bottom:0;margin-top:14px;gap:10px;}
.lockpwd-overlay.panel-variant .lockpwd-bottom button{
  color:var(--ink-2);background:rgba(120,120,128,.12);
  font-weight:600;padding:11px 26px;border-radius:12px;
}
.lockpwd-overlay.panel-variant .lockpwd-bottom button:active{background:rgba(120,120,128,.22);}

.homescreen{
  position:absolute;inset:0;z-index:10;
  opacity:0;transform:scale(.94);pointer-events:none;
  transition:opacity .4s ease,transform .4s cubic-bezier(.32,.72,0,1);
}
.homescreen.active{opacity:1;transform:scale(1);pointer-events:auto;}
.home-wall{
  position:absolute;inset:0;
  background: var(--bg-2);
  background-size:cover;background-position:center;
  transition:background-image .35s ease;
}
.home-pages-viewport{
  position:absolute;top:60px;left:0;right:0;bottom:124px;
  overflow:hidden;touch-action:none;
}
.home-pages-track{
  display:flex;height:100%;
  transition:transform .38s cubic-bezier(.32,.72,0,1);
  will-change:transform;
}
.home-page{flex:0 0 100%;width:100%;height:100%;position:relative;}
.home-item{
  position:absolute;touch-action:none;user-select:none;-webkit-user-drag:none;cursor:pointer;
  transition:transform .3s cubic-bezier(.34,1.4,.4,1),
             left .3s cubic-bezier(.34,1.4,.4,1),
             top .3s cubic-bezier(.34,1.4,.4,1),
             width .3s cubic-bezier(.34,1.4,.4,1),
             height .3s cubic-bezier(.34,1.4,.4,1);
}
.home-item-app{
  display:flex;flex-direction:column;align-items:center;gap:8px;
  padding-top:6px;
}
.home-item-app .glyph{
  width:56px;height:56px;
  background:#ffffff;
  border:1px solid rgba(60,60,67,.06);
  box-shadow:0 4px 12px rgba(60,60,67,.04);
  border-radius:16px;
  display:grid;place-items:center;
  color:var(--ink);
  overflow:hidden;
  position:relative;
  transition:transform .5s cubic-bezier(.34,1.9,.4,1);
}
.home-item-app .glyph.custom-icon{
  background:transparent;
  border:none;
  box-shadow:none;
}
.home-item-app .glyph.custom-icon img{
  border-radius:16px;
}
.home-item-app .glyph svg{width:32px;height:32px;stroke-width:1.4;}
.home-item-app .glyph img{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;border-radius:14px;
}
.home-item-app .label{
  font-size:11px;color:var(--ink-2);letter-spacing:.3px;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  text-align:center;font-weight:500;
}
.homescreen.editing .home-item-app{animation:jiggle .42s ease-in-out infinite;}
@keyframes jiggle{0%,100%{rotate:-1.2deg;}50%{rotate:1.2deg;}}
.homescreen.editing .home-item-widget{animation:jiggle-widget .5s ease-in-out infinite;}
@keyframes jiggle-widget{0%,100%{rotate:-0.5deg;}50%{rotate:0.5deg;}}
.home-item .delete-btn{
  position:absolute;top:-6px;right:-6px;
  width:22px;height:22px;border-radius:50%;
  background:linear-gradient(180deg,#ff8a8a,#e05a5a);
  border:1.5px solid rgba(255,255,255,.95);
  color:#fff;font-size:15px;font-weight:300;line-height:1;
  display:none;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:0 3px 8px rgba(200,50,40,.3);
  z-index:10;
}
.homescreen.editing .home-item-widget .delete-btn{display:flex;}
.homescreen.editing .home-item .delete-btn:active{transform:scale(.85);}
.drag-ghost{
  position:fixed!important;z-index:99999;pointer-events:none;
  animation:none!important;rotate:0deg!important;
  filter:drop-shadow(0 20px 32px rgba(20,20,30,.24));
  opacity:.94;transition:none!important;
}
.drag-source{opacity:.25!important;}
.home-dots{
  position:absolute;left:0;right:0;
  bottom: calc(var(--dock-bottom) + var(--dock-height) + 12px);
  display:flex;justify-content:center;gap:7px;
  z-index:5;pointer-events:none;
}
.home-dot{
  width:6px;height:6px;border-radius:50%;
  background:rgba(60,60,67,.20);
  transition:background .25s,transform .25s;
}
.home-dot.active{background:var(--ink-2);transform:scale(1.2);}

.dock{
  position:absolute;bottom: var(--dock-bottom);left:14px;right:14px;
  height: var(--dock-height);
  border-radius:32px;
  background:var(--glass-2);
  backdrop-filter:blur(32px) saturate(180%);
  -webkit-backdrop-filter:blur(32px) saturate(180%);
  border:1px solid rgba(255,255,255,.9);
  box-shadow:var(--shadow-2);
  display:flex;align-items:center;justify-content:space-around;
  padding:0 18px;z-index:6;
}
.dock .app-icon{
  display:flex;flex-direction:column;align-items:center;
  cursor:pointer;user-select:none;
  transition:transform .5s cubic-bezier(.34,1.9,.4,1);
}
.dock .app-icon:active{transform:scale(.86);transition:transform .07s ease-out;}
.dock .app-icon .glyph{
  width:52px;height:52px;
  background:#ffffff;
  border:1px solid rgba(60,60,67,.06);
  box-shadow:0 4px 12px rgba(60,60,67,.04);
  border-radius:16px;
  display:grid;place-items:center;
  color:var(--ink);
  overflow:hidden;position:relative;
}
.dock .app-icon .glyph.custom-icon{
  background:transparent;
  border:none;
  box-shadow:none;
}
.dock .app-icon .glyph.custom-icon img{
  border-radius:16px;
}
.dock .app-icon .glyph svg{width:30px;height:30px;stroke-width:1.4;}
.dock .app-icon .glyph img{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;border-radius:14px;
}

.widget-inner{
  width:100%;height:100%;
  border-radius:22px;
  background:var(--glass-2);
  backdrop-filter:blur(28px) saturate(180%);
  -webkit-backdrop-filter:blur(28px) saturate(180%);
  border:1px solid rgba(255,255,255,.85);
  box-shadow:var(--shadow-1);
  color:var(--ink);
  overflow:hidden;position:relative;
}

.widget-clock{display:flex;flex-direction:column;justify-content:center;align-items:center;padding:14px 16px;gap:4px;text-align:center;}
.w-clock-time{font-size:42px;font-weight:250;letter-spacing:-2px;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink);}
.w-clock-meta{display:flex;align-items:center;justify-content:center;gap:5px;font-size:11px;font-weight:500;letter-spacing:.3px;color:var(--ink-3);white-space:nowrap;overflow:hidden;max-width:100%;line-height:1.2;}
.w-clock-date{font-variant-numeric:tabular-nums;flex-shrink:0;}
.w-clock-sep{opacity:.5;flex-shrink:0;}
.w-clock-weather{display:inline-flex;align-items:center;gap:3px;min-width:0;transition:opacity .3s;}
.w-clock-weather[data-weather-state="empty"],
.w-clock-weather[data-weather-state="loading"],
.w-clock-weather[data-weather-state="error"]{opacity:.6;}
.w-clock-weather .wc-txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
.wc-ico{display:inline-grid;place-items:center;flex-shrink:0;width:1.15em;height:1.15em;}
.wc-ico svg{width:100%;height:100%;display:block;}
.widget-clock.size-2x2 .w-clock-meta{flex-direction:column;gap:2px;font-size:11.5px;white-space:normal;}
.widget-clock.size-2x2 .w-clock-sep{display:none;}
.widget-clock.size-4x1{flex-direction:row;justify-content:space-between;align-items:center;padding:8px 20px;gap:14px;text-align:left;}
.widget-clock.size-4x1 .w-clock-time{font-size:34px;letter-spacing:-1.6px;flex-shrink:0;}
.widget-clock.size-4x1 .w-clock-meta{font-size:11.5px;justify-content:flex-end;}
.widget-clock.size-4x2{padding:18px 20px;gap:5px;}
.widget-clock.size-4x2 .w-clock-time{font-size:62px;letter-spacing:-3.5px;}
.widget-clock.size-4x2 .w-clock-meta{font-size:12.5px;}
.widget-clock.size-4x3{padding:22px 24px;gap:7px;}
.widget-clock.size-4x3 .w-clock-time{font-size:88px;letter-spacing:-5px;}
.widget-clock.size-4x3 .w-clock-meta{font-size:14px;}
.widget-clock.size-4x4{padding:26px 28px;gap:10px;}
.widget-clock.size-4x4 .w-clock-time{font-size:108px;letter-spacing:-6px;}
.widget-clock.size-4x4 .w-clock-meta{font-size:16px;}

.widget-calendar-mini{display:flex;flex-direction:column;padding:12px 12px 10px;}
.w-cal-title{font-size:12px;font-weight:600;letter-spacing:.4px;color:var(--ink-2);margin-bottom:6px;flex-shrink:0;}
.w-cal-weekdays-mini{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;margin-bottom:2px;flex-shrink:0;}
.w-cal-weekdays-mini span{text-align:center;font-size:8px;font-weight:600;color:var(--ink-3);letter-spacing:.2px;}
.w-cal-grid-mini{display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(6,1fr);gap:1px;flex:1;min-height:0;}
.w-cal-cell-mini{display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:500;position:relative;color:var(--ink-3);min-height:0;min-width:0;}
.w-cal-cell-mini .w-cal-num{position:relative;z-index:1;font-variant-numeric:tabular-nums;line-height:1;}
.w-cal-cell-mini.other-month{opacity:.35;}
.w-cal-cell-mini.has-event:not(.today)::before{content:'';position:absolute;top:50%;left:50%;width:15px;height:15px;border-radius:50%;border:1.5px solid var(--marker-color, var(--accent));transform:translate(-50%,-50%);pointer-events:none;}
.w-cal-cell-mini.today{color:var(--ink);font-weight:700;}
.w-cal-cell-mini.today::before{content:'';position:absolute;top:50%;left:50%;width:15px;height:15px;border-radius:50%;background:var(--accent-soft);transform:translate(-50%,-50%);pointer-events:none;}
.w-cal-cell-mini.today.has-event::after{content:'';position:absolute;left:50%;bottom:2px;width:9px;height:1.6px;border-radius:2px;background:var(--marker-color, var(--accent));transform:translateX(-50%);pointer-events:none;}
.widget-calendar-full{display:flex;flex-direction:column;padding:14px 16px;}
.w-calf-title{display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:600;margin-bottom:10px;letter-spacing:.3px;flex-shrink:0;color:var(--ink-2);}
.w-calf-weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px;flex-shrink:0;}

.widget-inner.widget-polaroid{
  background:transparent !important;
  border:none !important;
  box-shadow:none !important;
  backdrop-filter:none !important;
  -webkit-backdrop-filter:none !important;
  overflow:visible;
}
.polaroid-stack{
  position:relative;width:100%;height:100%;
}
.polaroid-card{
  position:absolute;
  background:#fff;
  border-radius:5px;
  padding:7px 7px 20px 7px;
  box-shadow:0 12px 22px -14px rgba(20,20,30,.35), 0 3px 6px -2px rgba(20,20,30,.10);

.polaroid-card .pc-inner{

.polaroid-card .pc-inner svg{width:24px;height:24px;stroke-width:1.2;opacity:.6;}
.polaroid-card.slot-1{
  left:4%; top:6%;

  z-index:1;
}
.polaroid-card.slot-2{

.widget-inner.widget-music{
  background:linear-gradient(155deg, #fdfdfe 0%, #f5f5f7 60%, #eeeef2 100%);
  border:1px solid rgba(255,255,255,.9);
  box-shadow:var(--shadow-1);
  color:var(--ink);
}
.wm-stack{
  position:relative;width:100%;height:100%;
  display:flex;flex-direction:column;
  padding:12px 12px 10px;
  gap:8px;
}
.wm-top{
  display:flex;align-items:center;gap:8px;
  flex:1;min-height:0;
}
.wm-disc{
  width:44px;height:44px;border-radius:50%;
  background:radial-gradient(circle at 50% 50%, #38383c 0%, #1a1a1c 55%, #050506 100%);
  position:relative;flex-shrink:0;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.06), 0 4px 10px -4px rgba(20,20,30,.35);
  overflow:hidden;
}
.wm-disc::before{
  content:'';position:absolute;inset:32% 32% 32% 32%;
  border-radius:50%;
  background:radial-gradient(circle, #cfcfd4 0%, #a8a8b0 70%, #888890 100%);
  background-size:cover;background-position:center;
}
.wm-disc.has-cover::before{
  inset:0;
  background-image:var(--wm-cover, none);
  background-size:cover;background-position:center;
  border-radius:50%;
}
.wm-disc::after{
  content:'';position:absolute;inset:44% 44% 44% 44%;
  border-radius:50%;background:#1a1a1c;
}
.wm-disc.playing{animation:wmSpin 20s linear infinite;}
@keyframes wmSpin{to{transform:rotate(360deg);}}
.wm-info{
  flex:1;min-width:0;
  display:flex;flex-direction:column;gap:3px;
  justify-content:center;
}
.wm-title{
  font-size:12px;font-weight:600;
  color:var(--ink);letter-spacing:.2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.wm-title.empty{color:var(--ink-4);font-weight:400;}
.wm-artist{
  font-size:10px;font-weight:400;
  color:var(--ink-3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.wm-progress-row{
  display:flex;align-items:center;gap:6px;
}
.wm-time{
  font-size:9.5px;font-variant-numeric:tabular-nums;
  color:var(--ink-3);
  flex-shrink:0;font-weight:500;
}
.wm-progress{
  flex:1;height:3px;border-radius:2px;
  background:rgba(30,30,40,.14);
  position:relative;cursor:pointer;
}
.wm-progress-fill{
  position:absolute;left:0;top:0;bottom:0;
  background:var(--ink);border-radius:2px;
  transition:width .15s linear;
}
.wm-progress-fill::after{
  content:'';position:absolute;right:-3px;top:50%;
  width:7px;height:7px;border-radius:50%;background:var(--ink);
  transform:translateY(-50%);
  opacity:0;transition:opacity .2s;
}
.widget-music.playing .wm-progress-fill::after{opacity:1;}
/* ★ 音乐盒控件：加 prev/next */
.wm-controls{
  display:flex;align-items:center;justify-content:center;
  gap:14px;
}
.wm-play{
  width:28px;height:28px;border-radius:50%;
  border:none;
  background:var(--ink);color:#fff;
  display:grid;place-items:center;cursor:pointer;
  transition:transform .35s cubic-bezier(.34,1.9,.4,1), background .2s;
  padding:0;
  box-shadow:0 6px 14px -6px rgba(20,20,30,.35);
  flex-shrink:0;
}
.wm-play:active{transform:scale(.88);background:#000;}
.wm-play svg{width:13px;height:13px;display:block;}
.wm-play .icon-play{margin-left:2px;}
.wm-prev,.wm-next{
  width:22px;height:22px;border-radius:50%;
  border:none;background:transparent;
  color:var(--ink-3);
  display:grid;place-items:center;cursor:pointer;padding:0;flex-shrink:0;
  transition:transform .3s cubic-bezier(.34,1.9,.4,1), color .2s;
}
.wm-prev:active,.wm-next:active{transform:scale(.85);color:var(--ink);}
.wm-prev svg,.wm-next svg{width:13px;height:13px;display:block;fill:currentColor;}

.avatar-editor{display:flex;flex-direction:column;align-items:center;padding:16px 0 24px;}

.sticker-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;padding:2px 0 8px;}

.tide-cal-day .day-ring{display:none;position:absolute;inset:3px;border-radius:50%;pointer-events:none;z-index:2;}
.tide-cal-day.period-start .day-ring,.tide-cal-day.period-end .day-ring{display:block;}
.tide-cal-day.period-start .day-ring{border:2px solid #d98a9c;}
.tide-cal-day.period-end .day-ring{border:2px dashed #d98a9c;}
.tide-cal-day.period-start.period-end .day-ring{border-style:solid;}
.tide-legend{display:flex;flex-wrap:wrap;gap:14px;padding:10px 10px 0;margin-bottom:-6px;}
.tide-legend-item{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--phase-deep);opacity:.72;font-weight:500;}
.tide-legend-mark{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.tide-legend-mark.lg-flow{background:#d98a9c;}
.tide-legend-mark.lg-pred{border:1.5px dashed #d98a9c;opacity:.7;}
.tide-legend-mark.lg-ovu{border:2px solid #d4a868;}
.tide-legend-mark.lg-fert{border:1.5px dashed #d4a868;opacity:.7;}
.tide-legend-mark.lg-start{border:2px solid #d98a9c;}
.tide-legend-mark.lg-end{border:2px dashed #d98a9c;}
.tide-empty-hint{text-align:center;font-size:12.5px;color:var(--phase-deep);opacity:.6;padding:14px 20px 6px;line-height:1.7;}
.tide-fab-row{padding:0 4px;margin-bottom:8px;}
.tide-fab{
  width:100%;border:none;

  padding:15px 0;border-radius:18px;cursor:pointer;

}
.tide-fab:active{transform:scale(.96);}
.tide-fab svg{width:18px;height:18px;opacity:.95;}
#tideEditor{
  position:absolute;inset:0;z-index:9600;
  background:rgba(30,30,40,.32);

}
#tideEditor.show{opacity:1;pointer-events:auto;}
.tide-editor-panel{

  box-shadow:0 -20px 60px -20px rgba(20,20,30,.22);

.tide-editor-handle{width:40px;height:4px;border-radius:2px;background:rgba(60,60,67,.18);margin:0 auto 14px;}
.tide-editor-datenav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:22px;padding:0 2px;}
.tide-editor-datenav-btn{
  width:36px;height:36px;flex-shrink:0;border:none;

  color:var(--tide-editor-main, #d98a9c);

  transition:background .15s, transform .15s;user-select:none;padding-bottom:2px;

.tide-editor-datenav-btn:active{background:rgba(120,120,128,.18);transform:scale(.92);}
.tide-editor-date{flex:1;font-size:17px;font-weight:600;color:var(--ink);text-align:center;letter-spacing:.3px;font-variant-numeric:tabular-nums;min-width:0;}
.tide-editor-section{margin-bottom:20px;}
.tide-editor-section-title{font-size:12px;font-weight:600;color:var(--ink-3);letter-spacing:.8px;margin-bottom:10px;text-transform:uppercase;}
.tide-chips{display:flex;flex-wrap:wrap;gap:8px;}
.tide-chip{
  padding:8px 14px;border-radius:12px;

  font-size:13.5px;font-weight:500;cursor:pointer;

  user-select:none;
}

.tide-chip.active{background:var(--tide-editor-soft, #f8dde2);color:var(--tide-editor-main, #d98a9c);border-color:var(--tide-editor-main, #d98a9c);font-weight:600;}
.tide-chip.pain-1.active{background:#e8f3e4;color:#4a8a5e;border-color:#88c890;}
.tide-chip.pain-2.active{background:#edf5e0;color:#6a8837;border-color:#a8c975;}
.tide-chip.pain-3.active{background:#fff4dc;color:#b87a25;border-color:#e8c478;}
.tide-chip.pain-4.active{background:#ffe8dc;color:#c25a2c;border-color:#e89a76;}
.tide-chip.pain-5.active{background:#fadcdc;color:#a03e3e;border-color:#e88a86;}
.tide-chip.period-mark-start.active{background:#f8dde2;color:#d98a9c;border-color:#d98a9c;font-weight:600;}
.tide-chip.period-mark-end.active{background:#fae4e8;color:#b86070;border-color:#b86070;font-weight:600;}
.tide-editor-textarea{
  width:100%;border:1px solid rgba(60,60,67,.10);
  background:var(--bg-2);border-radius:12px;
  padding:11px 14px;font:inherit;font-size:14.5px;

.tide-editor-actions{display:flex;gap:10px;margin-top:8px;}
.tide-editor-actions button{
  flex:1;border:none;font:inherit;font-size:15px;font-weight:600;
  padding:13px 0;border-radius:14px;cursor:pointer;
  transition:transform .5s cubic-bezier(.34,1.9,.4,1),opacity .2s,background .2s,color .2s;
}

.tide-editor-cancel{background:rgba(120,120,128,.12);color:var(--ink-2);}

.tide-editor-delete{background:rgba(217,138,156,.10);color:#d98a9c;}
.tide-editor-delete:disabled{background:rgba(120,120,128,.06);color:rgba(60,60,67,.25);cursor:not-allowed;pointer-events:none;}
.tide-overview{padding:16px 14px 40px;background:linear-gradient(170deg, var(--phase-bg-1) 0%, var(--phase-bg-2) 42%, var(--phase-bg-3) 100%);min-height:100%;overflow-y:auto;}
.tide-overview-card{

.tide-stat-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:.5px solid rgba(60,60,67,.06);}

.tide-stat-label{font-size:14px;color:var(--phase-deep);opacity:.75;}

.tide-bar-chart{display:flex;align-items:flex-end;justify-content:space-between;gap:6px;height:80px;padding:0 4px;}

.tide-cycle-list{display:flex;flex-direction:column;gap:8px;max-height:280px;overflow-y:auto;}

function friendlyError(e) {
  if (e === null || e === undefined) return '出错了';
  if (typeof e === 'string') return e;
  const msg = e.message || '';
  const status = e.status;
  if (e.name === 'AbortError') return '已取消';
  if (msg === '请求超时') return '请求超时，稍后再试';
  if (/failed to fetch|networkerror|network request failed|load failed/i.test(msg)) return '网络连接失败';
  if (status === 401 || status === 403) return 'API Key 无效或没有权限';
  if (status === 404) return '接口地址不对';
  if (status === 429) return '请求太频繁，歇一下';
  if (typeof status === 'number' && status >= 500) return `服务器出错（${status}）`;
  return msg || '出错了';

function normalizeBaseUrl(url) {

    res = await fetch(`${base}/models`, { method: 'GET', headers: { 'Authorization': `Bearer ${apiKey}`, 'Accept': 'application/json' } });

  let data; try { data = await res.json(); } catch (_) { throw new Error('返回内容不是 JSON'); }

  if (Array.isArray(data?.data)) arr = data.data;
  else if (Array.isArray(data?.models)) arr = data.models;
  else if (Array.isArray(data)) arr = data;
  const ids = arr.map(m => (typeof m === 'string' ? m : (m?.id || m?.name || ''))).filter(Boolean);

  const lines = String(text || '').split('\n');

  const hasImage = (friend.messages || []).some(m => m && m.role === 'user' && m.image);
  if (useVision && hasImage) {
    baseUrl = normalizeBaseUrl(api.visionUrl || api.url);
    key = (api.visionKey && api.visionKey.trim()) || api.key;
    model = api.visionModel;
  } else {
    baseUrl = normalizeBaseUrl(api.url);
    key = api.key; model = api.model;
  }
  if (!baseUrl) throw new Error('接口地址不对');
  let res;
  try {
    res = await fetch(`${baseUrl}/chat/completions`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
      body: JSON.stringify({ model, messages, temperature: (typeof api.temperature === 'number') ? api.temperature : 0.8, stream: true })

  } catch (e) { throw new Error('网络连接失败'); }
  if (!res.ok) throw await makeHttpError(res);

  const isSSE = contentType.includes('text/event-stream');
  if (!isSSE) {

    if (onChunk) { try { onChunk(content); } catch (_) {} }
    return content;
  }

  const decoder = new TextDecoder();
  let buffer = ''; let accumulated = '';
  while (true) {
    let chunk; try { chunk = await reader.read(); } catch (_) { break; }
    const { done, value } = chunk;
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const lines = buffer.split('\n');
    buffer = lines.pop();
    for (const rawLine of lines) {
      const line = rawLine.trim();
      if (!line || !line.startsWith('data:')) continue;
      const payload = line.slice(5).trim();
      if (!payload) continue;
      if (payload === '[DONE]') { try { reader.cancel(); } catch (_) {} return accumulated; }
      try {
        const json = JSON.parse(payload);
        const delta = json?.choices?.[0]?.delta?.content;
        if (delta) { accumulated += delta; if (onChunk) { try { onChunk(accumulated); } catch (_) {} } }
      } catch (_) {}

}

    req.onerror = () => reject(req.error);
  });

}

function fileToDataURL(file, maxSize = 1600, quality = .85, forcePng = false) {
  return new Promise((resolve, reject) => {
    if (!file || !file.type.startsWith('image/')) return reject(new Error('不是图片文件'));
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('文件读取失败'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('图片解析失败'));
      img.onload = () => {
        let w = img.naturalWidth, h = img.naturalHeight;
        const scale = Math.min(1, maxSize / Math.max(w, h));
        w = Math.max(1, Math.round(w * scale));
        h = Math.max(1, Math.round(h * scale));
        const cvs = document.createElement('canvas');
        cvs.width = w; cvs.height = h;
        const ctx = cvs.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        try { resolve(forcePng ? cvs.toDataURL('image/png') : cvs.toDataURL('image/jpeg', quality)); }
        catch (e) { resolve(cvs.toDataURL('image/png')); }
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
function readFileAsDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('读取失败'));
    reader.onload = () => resolve(reader.result);
    reader.readAsDataURL(file);
  });
}
function getAudioDuration(blob) {
  return new Promise((resolve) => {
    let url;
    try { url = URL.createObjectURL(blob); } catch (_) { resolve(0); return; }
    const a = new Audio();
    let done = false;
    const finish = (d) => {
      if (done) return; done = true;
      try { URL.revokeObjectURL(url); } catch (_) {}
      resolve(d || 0);
    };
    a.addEventListener('loadedmetadata', () => finish(a.duration));
    a.addEventListener('error', () => finish(0));
    setTimeout(() => finish(0), 6000);
    try { a.src = url; } catch (_) { finish(0); }
  });
}
function getAudioDurationFromUrl(url) {
  return new Promise((resolve) => {
    const a = new Audio();
    a.preload = 'metadata';
    let done = false;
    const finish = (d) => {
      if (done) return; done = true;
      try { a.src = ''; } catch (_) {}
      resolve(d || 0);
    };
    a.addEventListener('loadedmetadata', () => {
      const d = a.duration;
      if (isFinite(d) && d > 0) finish(d);
      else finish(0);
    });
    a.addEventListener('error', () => finish(0));
    setTimeout(() => finish(0), 8000);
    try { a.src = url; } catch (_) { finish(0); }
  });
}

function fmtTime(ts) {
  if (!ts) return '';
  const d = new Date(ts); const now = new Date();
  if (d.toDateString() === now.toDateString()) return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');

}

function momentTimeAgo(ts) {
  if (!ts) return '';
  const diff = Date.now() - ts;
  if (diff < 60 * 1000) return '刚刚';
  if (diff < 60 * 60 * 1000) return Math.floor(diff / 60000) + '分钟前';
  if (diff < 24 * 60 * 60 * 1000) return Math.floor(diff / 3600000) + '小时前';
  if (diff < 2 * 24 * 60 * 60 * 1000) return '昨天';
  if (diff < 7 * 24 * 60 * 60 * 1000) return Math.floor(diff / (24 * 3600 * 1000)) + '天前';
  const d = new Date(ts);

}

  unlocked: false,
  listeners: new Set(),
  _objectUrls: {},
  _lastNotify: 0,

  init() {
    if (this.audio) return;
    const a = new Audio();
    a.preload = 'metadata';
    this.audio = a;
    a.addEventListener('timeupdate', () => {
      this.currentTime = a.currentTime;
      const now = Date.now();
      if (now - this._lastNotify > 220) {
        this._lastNotify = now;
        this.notify();
      }
    });
    const syncDuration = () => {
      if (isFinite(a.duration) && a.duration > 0) {
        this.duration = a.duration;
        const track = this.getTrack();
        // 如果发现数据库里保存的时长和实际时长差异大于 1 秒，自动修正并保存
        if (track && Math.abs((track.duration || 0) - a.duration) > 1) {
          track.duration = a.duration;
          save();
          // 实时更新当前页面上对应歌曲的时长文字
          const items = document.querySelectorAll(`[data-track-id="${track.id}"]`);
          items.forEach(item => {
            const durEl = item.querySelector('.music-track-dur') || item.querySelector('.music-recent-dur');
            if (durEl) durEl.textContent = fmtSec(a.duration);
          });
        }
      }
      this.notify();
    };
    a.addEventListener('loadedmetadata', syncDuration);
    a.addEventListener('durationchange', syncDuration);
    a.addEventListener('play', () => { this.playing = true; this.notify(); });
    a.addEventListener('pause', () => { this.playing = false; this.notify(); });
    a.addEventListener('ended', () => { this.handleEnded(); });

    this.setupMediaSession();
  },

  subscribe(fn) {
        a.addEventListener('error', async () => {
      this.playing = false;
      const t = this.getTrack();
      const now = Date.now();
      const canRetry = t && t.source === 'online' && t.onlineId
                    && !this._urlRefreshing
                    && (!this._lastUrlRetryAt || now - this._lastUrlRetryAt > 30000);
      if (canRetry) {
        this._urlRefreshing = true;
        this._lastUrlRetryAt = now;
        try {
          const newUrl = await fetchOnlinePlayUrlById(t.onlineId, t.onlineSource || 'netease');
          this._urlRefreshing = false;
          if (newUrl && newUrl !== t.url) {
            t.url = newUrl;
            save();
            this.load(t.id, true);
            return;
          }
        } catch (_) {
          this._urlRefreshing = false;
        }
      toast('这首歌暂时听不了，换一首试试');
    }
    this.notify();
    });
    this.setupMediaSession();
  },

  subscribe(fn) {
    this.listeners.add(fn);
    try { fn(this); } catch (_) {}
    return () => this.listeners.delete(fn);
  },
  unsubscribe(fn) { this.listeners.delete(fn); },
  notify() {
    this.listeners.forEach(fn => { try { fn(this); } catch (_) {} });
  },

  getTrack() {
    if (!this.trackId) return null;
    return state.music.tracks.find(t => t.id === this.trackId) || null;
  },
  getTrackById(id) {
    return state.music.tracks.find(t => t.id === id) || null;
  },

  async getPlayableUrl(track) {
    if (!track) return null;
    if (track.source === 'url' && track.url) return track.url;
    if (track.source === 'online' && track.url) return track.url;
    if (track.source === 'local' && track.blobKey) {
      if (this._objectUrls[track.id]) return this._objectUrls[track.id];
      const blob = await idbGetMusic(track.blobKey);
      if (!blob) return null;
      const url = URL.createObjectURL(blob);
      this._objectUrls[track.id] = url;
      return url;
    }
    return null;
  },

  async load(trackId, autoplay = false) {
    this.init();
    const track = this.getTrackById(trackId);
    if (!track) { toast('曲目不存在'); return; }
    this.trackId = trackId;
    this.currentTime = 0;
    this.duration = track.duration || 0;
    const url = await this.getPlayableUrl(track);
    if (!url) { toast('无法加载音频'); return; }
    try { this.audio.src = url; } catch (_) {}
    this.updateMediaSession(track);
    this.addToHistory(trackId);
    this.notify();
    if (autoplay) {
      try {
        const p = this.audio.play();
        if (p && p.catch) p.catch((err) => { console.warn('autoplay rejected:', err); });
      } catch (_) {}
    }
  },

  play() {
    this.init();
    if (!this.trackId) return;
    if (!this.unlocked) { toast('先点击一次播放按钮'); return; }
    // ★ 修复：如果已经播到末尾/ended，先回到开头再播
    try {
      if (this.audio.ended || (this.audio.duration > 0 && this.audio.currentTime >= this.audio.duration - 0.05)) {
        this.audio.currentTime = 0;
        this.currentTime = 0;
      }
    } catch (_) {}
    try {
      const p = this.audio.play();
      if (p && p.catch) p.catch((err) => { console.warn('play rejected:', err); });
    } catch (_) {}
  },
  pause() { if (this.audio) { try { this.audio.pause(); } catch (_) {} } },
  toggle() {
    if (!this.audio || !this.trackId) return;
    if (this.playing) this.pause();
    else this.play();
  },
  seek(sec) {
    if (!this.audio) return;
    const d = this.duration || 0;
    const v = Math.max(0, Math.min(d, sec));
    try { this.audio.currentTime = v; } catch (_) {}
    this.currentTime = v;
    this.notify();
  },

  async next() {
    if (!this.queue.length) return;
    if (this.mode === 'shuffle') {
      let idx = Math.floor(Math.random() * this.queue.length);
      if (this.queue.length > 1 && idx === this.queueIndex) idx = (idx + 1) % this.queue.length;
      this.queueIndex = idx;
    } else {
      this.queueIndex = (this.queueIndex + 1) % this.queue.length;
    }
    await this.load(this.queue[this.queueIndex], true);
  },
  async prev() {
    if (!this.queue.length) return;
    if (this.audio && this.currentTime > 3) { this.seek(0); return; }
    this.queueIndex = (this.queueIndex - 1 + this.queue.length) % this.queue.length;
    await this.load(this.queue[this.queueIndex], true);
  },

  setMode(mode) {
    this.mode = mode;
    state.music.lastMode = mode;
    if (this.audio) this.audio.loop = (mode === 'loop-one');
    save();
    this.notify();
  },
  cycleMode() {
    const modes = ['loop-all', 'loop-one', 'shuffle'];
    const i = modes.indexOf(this.mode);
    this.setMode(modes[(i + 1) % modes.length]);
  },

  setQueue(trackIds, startIndex = 0) {
    this.queue = [...trackIds];
    this.queueIndex = Math.max(0, Math.min(this.queue.length - 1, startIndex));
  },

  handleEnded() {
    if (this.mode === 'loop-one') {
      try { this.audio.currentTime = 0; this.audio.play().catch(() => {}); } catch (_) {}
    } else {
      this.next();
    }
  },

  stop() {
    if (this.audio) {
      try { this.audio.pause(); this.audio.src = ''; } catch (_) {}
    }
    this.trackId = null;
    this.playing = false;
    this.currentTime = 0;
    this.duration = 0;
    this.notify();
  },

  revokeObjectUrl(trackId) {
    if (this._objectUrls[trackId]) {
      try { URL.revokeObjectURL(this._objectUrls[trackId]); } catch (_) {}
      delete this._objectUrls[trackId];
    }
  },

  setupMediaSession() {
    if (!('mediaSession' in navigator)) return;
    try {
      navigator.mediaSession.setActionHandler('play', () => this.play());
      navigator.mediaSession.setActionHandler('pause', () => this.pause());
      navigator.mediaSession.setActionHandler('previoustrack', () => this.prev());
      navigator.mediaSession.setActionHandler('nexttrack', () => this.next());
      navigator.mediaSession.setActionHandler('seekto', (e) => { if (e.seekTime != null) this.seek(e.seekTime); });
    } catch (_) {}
  },
  updateMediaSession(track) {
    if (!('mediaSession' in navigator) || !track) return;
    try {
      const artwork = track.cover ? [{ src: track.cover, sizes: '512x512', type: 'image/jpeg' }] : [];
      navigator.mediaSession.metadata = new MediaMetadata({
        title: track.name || '未命名',
        artist: track.artist || '',
        album: track.album || '',
        artwork
      });
    } catch (_) {}
  },

  addToHistory(trackId) {
    if (!Array.isArray(state.music.playHistory)) state.music.playHistory = [];
    state.music.playHistory = [trackId, ...state.music.playHistory.filter(id => id !== trackId)].slice(0, 50);
    state.music.lastPlayedId = trackId;
  }
};
player.mode = state.music.lastMode || 'loop-all';
/* ★ 在线歌 URL 刷新：给 player 的 error 回调使用 */
async function fetchOnlinePlayUrlById(onlineId, source = 'netease') {
  if (!onlineId) return '';
  try {
    const url = `https://music-api.gdstudio.xyz/api.php?types=url&source=${encodeURIComponent(source)}&id=${encodeURIComponent(onlineId)}&br=320`;
    const res = await fetch(url);
    if (!res.ok) return '';
    const data = await res.json();
    return data.url || (data.data && data.data.url) || '';
  } catch (_) {
    return '';
  }
}
window.addEventListener('beforeunload', () => {
  Object.keys(player._objectUrls).forEach(k => {
    try { URL.revokeObjectURL(player._objectUrls[k]); } catch (_) {}
  });
});

function askPassword(opts = {}) {
  const { title = '请输入密码', allowCancel = false, allowReset = false, showTime = false, validate = null, failMessage = '', variant = 'fullscreen' } = opts;
  return new Promise((resolve) => {
    let overlay = $('#lockPwdOverlay');
    if (!overlay) {
      overlay = document.createElement('div');
      overlay.id = 'lockPwdOverlay';
      overlay.className = 'lockpwd-overlay';
      $('#screen').appendChild(overlay);
    }
    overlay.classList.remove('panel-variant');
    if (variant === 'panel') overlay.classList.add('panel-variant');
    const keysHTML = [1,2,3,4,5,6,7,8,9].map(n => `<button class="lockpwd-key" data-k="${n}" type="button">${n}</button>`).join('') + `
      <button class="lockpwd-key lockpwd-key-empty" type="button" disabled></button>
      <button class="lockpwd-key" data-k="0" type="button">0</button>
      <button class="lockpwd-key lockpwd-key-del" data-k="del" type="button" aria-label="删除">⌫</button>
    `;
    let timeStr = '';
    if (showTime) {
      const nd = new Date();
      timeStr = nd.getHours() + ':' + String(nd.getMinutes()).padStart(2, '0');
    }
    const innerContent = `
      ${showTime ? `<div class="lockpwd-time" id="lockPwdTime">${timeStr}</div>` : ''}
      <div class="lockpwd-title">${esc(title)}</div>
      <div class="lockpwd-dots" id="lockPwdDots">
        <span class="lockpwd-dot"></span>
        <span class="lockpwd-dot"></span>
        <span class="lockpwd-dot"></span>
        <span class="lockpwd-dot"></span>
      </div>
      <div class="lockpwd-keys" id="lockPwdKeys">${keysHTML}</div>
      <div class="lockpwd-bottom">
        ${allowCancel ? '<button id="lockPwdCancel" type="button">取消</button>' : ''}
        ${allowReset ? '<button id="lockPwdReset" type="button">恢复默认</button>' : ''}
      </div>
    `;
    if (variant === 'panel') overlay.innerHTML = `<div class="lockpwd-panel">${innerContent}</div>`;
    else overlay.innerHTML = innerContent;
    let input = ''; let settled = false;
    overlay.classList.remove('show');
    void overlay.offsetWidth;
    requestAnimationFrame(() => { if (!settled) overlay.classList.add('show'); });
    const close = (val) => {
      if (settled) return;
      settled = true;
      overlay.classList.remove('show');
      setTimeout(() => { if (!overlay.classList.contains('show')) overlay.innerHTML = ''; }, 300);
      resolve(val);
    };
    const dotsEl = overlay.querySelector('#lockPwdDots');
    const renderDots = () => {
      const dots = overlay.querySelectorAll('.lockpwd-dot');
      dots.forEach((d, i) => d.classList.toggle('filled', i < input.length));
    };
    const shakeAndClear = () => {
      if (failMessage) toast(failMessage);
      dotsEl.classList.add('shake');
      setTimeout(() => { dotsEl.classList.remove('shake'); input = ''; renderDots(); }, 440);
    };
    const trySubmit = (val) => {
      if (validate) {
        let ok = false;
        try { ok = !!validate(val); } catch (_) { ok = false; }
        if (!ok) { shakeAndClear(); return; }
      }
      close(val);
    };
    const keypad = overlay.querySelector('#lockPwdKeys');
    keypad.addEventListener('click', (e) => {
      const btn = e.target.closest('.lockpwd-key'); if (!btn) return;
      const k = btn.dataset.k; if (!k) return;
      if (k === 'del') { input = input.slice(0, -1); renderDots(); return; }
      if (input.length >= 4) return;
      input += k; renderDots();
      if (input.length === 4) setTimeout(() => trySubmit(input), 160);
    });
    const cancelBtn = overlay.querySelector('#lockPwdCancel');
    if (cancelBtn) cancelBtn.onclick = () => close(null);
    const resetBtn = overlay.querySelector('#lockPwdReset');
    if (resetBtn) resetBtn.onclick = () => close('__RESET__');
  });
}
async function tryUnlockWithPassword() {
  while (true) {
    const val = await askPassword({

      validate: (v) => v === state.settings.lockPassword, failMessage: '密码错误'

      save();

      continue;
    }

    return false;
  }
}

const GRID_COLS = 4;
const GRID_ROWS = 6;
const PAGE_PAD_X = 18;
const PAGE_PAD_TOP = 20;
const CELL_H = 92;
const CELL_GAP = 10;

const homeState = { editing: false, currentPage: 0 };

function getMetrics() {
  const vp = $('#homePagesViewport');
  if (!vp) return { cellW: 82, cellH: CELL_H, gap: CELL_GAP, padX: PAGE_PAD_X, padTop: PAGE_PAD_TOP, vw: 357 };
  const vw = vp.clientWidth;
  const cellW = (vw - PAGE_PAD_X * 2 - CELL_GAP * (GRID_COLS - 1)) / GRID_COLS;
  return { cellW, cellH: CELL_H, gap: CELL_GAP, padX: PAGE_PAD_X, padTop: PAGE_PAD_TOP, vw };
}
function computeItemRect(item, metrics) {
  const { cellW, cellH, gap, padX, padTop } = metrics;
  return {
    left: padX + item.col * (cellW + gap),
    top: padTop + item.row * (cellH + gap),
    width: item.w * cellW + (item.w - 1) * gap,
    height: item.h * cellH + (item.h - 1) * gap
  };
}
function itemIdOf(item) { return item.type === 'app' ? ('app_' + item.key) : ('widget_' + item.instanceId); }

function seedDefaultLayout() {
  const pages = [[], [], [], []];
  const postcard = { id: uid('w_'), type: 'postcard', w: 4, h: 2, config: defaultWidgetConfig('postcard') };
  state.widgets.push(postcard);

  const polaroid = { id: uid('w_'), type: 'polaroid', w: 2, h: 2, config: defaultWidgetConfig('polaroid') };
  state.widgets.push(polaroid);
  pages[0].push({ id: 'widget_' + polaroid.id, type: 'widget', instanceId: polaroid.id, row: 2, col: 0, w: 2, h: 2 });
  pages[0].push({ id: 'app_chat', type: 'app', key: 'chat', row: 2, col: 2, w: 1, h: 1 });
  pages[0].push({ id: 'app_memory', type: 'app', key: 'memory', row: 2, col: 3, w: 1, h: 1 });
  pages[0].push({ id: 'app_tide', type: 'app', key: 'tide', row: 3, col: 2, w: 1, h: 1 });
  pages[0].push({ id: 'app_beauty', type: 'app', key: 'beauty', row: 3, col: 3, w: 1, h: 1 });
  const dialogue = { id: uid('w_'), type: 'dialogue', w: 2, h: 2, config: defaultWidgetConfig('dialogue') };
  state.widgets.push(dialogue);
  pages[0].push({ id: 'widget_' + dialogue.id, type: 'widget', instanceId: dialogue.id, row: 4, col: 0, w: 2, h: 2 });
  const music = { id: uid('w_'), type: 'music', w: 2, h: 2, config: defaultWidgetConfig('music') };
  state.widgets.push(music);
  pages[0].push({ id: 'widget_' + music.id, type: 'widget', instanceId: music.id, row: 4, col: 2, w: 2, h: 2 });
  const placedKeys = new Set(['chat', 'memory', 'tide', 'beauty']);
  const dockSet = new Set(DOCK_APPS);
  const otherKeys = Object.keys(APPS).filter(k => !dockSet.has(k) && !placedKeys.has(k));
  let row = 0, col = 0;
  otherKeys.forEach(k => {
    pages[1].push({ id: 'app_' + k, type: 'app', key: k, row, col, w: 1, h: 1 });
    col++; if (col >= GRID_COLS) { col = 0; row++; }
  });
  state.homePages = pages;
  state.settings.layoutSeededV2 = true;
}

function initHomeLayout() {
  if (!Array.isArray(state.widgets)) state.widgets = [];
  state.widgets = state.widgets.map(w => ({ id: w.id || uid('w_'), type: w.type || 'clock', w: w.w || 2, h: w.h || 2, config: w.config || {} }));
  if (!Array.isArray(state.homePages) || !state.settings.layoutSeededV2) {
    state.widgets = [];
    state.homePages = null;
    seedDefaultLayout();
  }
  while (state.homePages.length < 4) state.homePages.push([]);
  const validWidgetIds = new Set(state.widgets.map(w => w.id));
  state.homePages = state.homePages.map(page =>
    page.filter(item => {
      if (item.type === 'app') return !!APPS[item.key];
      if (item.type === 'widget') return validWidgetIds.has(item.instanceId);
      return false;
    })
  );
  state.homePages = state.homePages.map(page => page.map(item => ({ ...item, id: item.id || itemIdOf(item) })));
  autoPlaceMissingApps();
}

function autoPlaceMissingApps() {
  const placed = new Set();
  const dockSet = new Set(DOCK_APPS);
  state.homePages.forEach(page => page.forEach(it => {
    if (it.type === 'app') placed.add(it.key);
  }));
  const missing = Object.keys(APPS).filter(k => !placed.has(k) && !dockSet.has(k));
  if (!missing.length) return;
  for (const key of missing) {
    let ok = false;
    for (let p = 0; p < state.homePages.length && !ok; p++) {
      for (let r = 0; r <= GRID_ROWS - 1 && !ok; r++) {
        for (let c = 0; c <= GRID_COLS - 1 && !ok; c++) {
          if (canPlaceAt(state.homePages[p], r, c, 1, 1, [])) {
            state.homePages[p].push({ id: 'app_' + key, type: 'app', key, row: r, col: c, w: 1, h: 1 });
            ok = true;
          }
        }
      }
    }
    if (!ok) state.homePages.push([{ id: 'app_' + key, type: 'app', key, row: 0, col: 0, w: 1, h: 1 }]);
  }
}

function canPlaceAt(page, row, col, w, h, excludeItems) {
  if (row < 0 || col < 0) return false;
  if (row + h > GRID_ROWS || col + w > GRID_COLS) return false;
  const cells = new Set();
  for (let r = row; r < row + h; r++) for (let c = col; c < col + w; c++) cells.add(r * GRID_COLS + c);
  for (const item of page) {
    if (excludeItems.includes(item)) continue;
    for (let r = item.row; r < item.row + item.h; r++)
      for (let c = item.col; c < item.col + item.w; c++)
        if (cells.has(r * GRID_COLS + c)) return false;
  }
  return true;
}
function rectsOverlap(a, b) { return !(a.col + a.w <= b.col || b.col + b.w <= a.col || a.row + a.h <= b.row || b.row + b.h <= a.row); }
function overlapsAnyWith(item, placedItems) { for (const other of placedItems) { if (other === item) continue; if (rectsOverlap(item, other)) return true; } return false; }
function overlapsAnyAt(placedItems, row, col, w, h) {
  for (const item of placedItems) {
    if (!(col + w <= item.col || item.col + item.w <= col || row + h <= item.row || item.row + item.h <= row)) return true;
  }
  return false;
}
function findNearestFreePositionInPage(w, h, placed, fromRow, fromCol) {
  if (w > GRID_COLS || h > GRID_ROWS) return null;
  const candidates = [];
  for (let r = 0; r <= GRID_ROWS - h; r++) {
    for (let c = 0; c <= GRID_COLS - w; c++) {
      if (!overlapsAnyAt(placed, r, c, w, h)) {
        const dist = Math.abs(r - fromRow) + Math.abs(c - fromCol) * 1.5;
        candidates.push({ row: r, col: c, dist });
      }
    }
  }
  if (!candidates.length) return null;
  candidates.sort((a, b) => a.dist - b.dist);
  return candidates[0];
}
function computeReorderForPage(pageIdx, item, targetRow, targetCol) {
  const page = state.homePages[pageIdx];
  if (!page) return null;
  const others = page.filter(it => it.id !== item.id);
  others.sort((a, b) => (a.row - b.row) || (a.col - b.col));
  const placed = [{ ...item, row: targetRow, col: targetCol }];
  const overflow = [];
  const pending = [...others];
  let safety = 300;

function attachMusicInteractions() {
  $$('.widget-music').forEach(el => {
    if (el.__bound) return;
    el.__bound = true;
    const playBtn = el.querySelector('[data-wm-play]');
    const prevBtn = el.querySelector('[data-wm-prev]');
    const nextBtn = el.querySelector('[data-wm-next]');
    const progressEl = el.querySelector('[data-wm-progress]');
    if (playBtn) {
      playBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        player.init();
        player.unlocked = true;
        if (player.trackId) {
          player.toggle();
        } else {
          const lastId = state.music.lastPlayedId;
          const last = lastId ? state.music.tracks.find(t => t.id === lastId) : null;
          if (last) {
            player.setQueue([last.id], 0);
            player.load(last.id, true);
          } else {
            openApp('music');
          }
        }
      });
    }
    if (prevBtn) {
      prevBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (!player.trackId) return;
        player.unlocked = true;
        player.prev();
      });
    }
    if (nextBtn) {
      nextBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (!player.trackId) return;
        player.unlocked = true;
        player.next();
      });
    }
    if (progressEl) {
      progressEl.addEventListener('click', (e) => {
        e.stopPropagation();
        if (!player.trackId) return;
        const rect = progressEl.getBoundingClientRect();
        const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
        player.seek(ratio * (player.duration || 0));
      });
    }
  });
}

/* ============================================================
   天气
   ============================================================ */
const weatherCache = { byCity: {} };
function getCachedWeather(city) {
  if (!city) return null;
  const c = weatherCache.byCity[city];
  if (!c || !c.data) return null;
  if (Date.now() - c.fetchedAt > 60 * 60 * 1000) return null;
  return c.data;
}
function weatherStateFor(city) {
  if (!city) return 'empty';
  if (getCachedWeather(city)) return 'ok';
  const c = weatherCache.byCity[city];
  if (c && c.promise) return 'loading';
  if (c && !c.data && !c.promise && c.fetchedAt && Date.now() - c.fetchedAt < 5 * 60 * 1000) return 'error';
  return 'loading';
}
function fetchWithTimeout(url, timeout) {
  return new Promise((resolve, reject) => {
    const controller = new AbortController();
    const timer = setTimeout(() => { try { controller.abort(); } catch (_) {} reject(new Error('请求超时')); }, timeout || 8000);
    fetch(url, { signal: controller.signal }).then(res => { clearTimeout(timer); resolve(res); }).catch(err => { clearTimeout(timer); if (err && err.name === 'AbortError') return; reject(err); });
  });
}
async function fetchWeatherForCity(city, force) {
  if (!city) return null;
  const cached = weatherCache.byCity[city];
  if (!force && cached && cached.data && Date.now() - cached.fetchedAt < 60 * 60 * 1000) return cached.data;
  if (cached && cached.promise) return cached.promise;
  const promise = (async () => {
    try {
      const geoUrl = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=zh&format=json`;
      const geoRes = await fetchWithTimeout(geoUrl, 8000);
      if (!geoRes.ok) throw new Error('地理查询失败');
      const geoData = await geoRes.json();
      const place = geoData && geoData.results && geoData.results[0];
      if (!place) throw new Error('找不到该城市');
      const wUrl = `https://api.open-meteo.com/v1/forecast?latitude=${place.latitude}&longitude=${place.longitude}&current=temperature_2m,weather_code&timezone=auto`;
      const wRes = await fetchWithTimeout(wUrl, 8000);
      if (!wRes.ok) throw new Error('天气查询失败');
      const wData = await wRes.json();
      const cur = wData && wData.current;
      if (!cur) throw new Error('天气数据为空');
      const data = { temp: Math.round(cur.temperature_2m), code: cur.weather_code };
      weatherCache.byCity[city] = { data, fetchedAt: Date.now(), promise: null };
      return data;
    } catch (e) {
      weatherCache.byCity[city] = { data: null, fetchedAt: Date.now(), promise: null, error: (e && e.message) || '获取失败' };
      throw e;
    }
  })();
  weatherCache.byCity[city] = { ...(cached || {}), promise };
  return promise;
}
function scheduleWeatherFetch(city) {
  if (!city) return;
  const c = weatherCache.byCity[city];
  if (c && c.data && Date.now() - c.fetchedAt < 60 * 60 * 1000) return;
  if (c && c.promise) return;
  if (c && !c.data && !c.promise && c.fetchedAt && Date.now() - c.fetchedAt < 5 * 60 * 1000) return;
  fetchWeatherForCity(city).then(info => updateWeatherOnHome(city, info)).catch(() => updateWeatherOnHome(city, null));
}
function updateWeatherOnHome(city, info) {
  $$('.widget-clock').forEach(el => {
    const widgetId = el.dataset.widgetId;
    const widget = state.widgets.find(w => w.id === widgetId);
    if (!widget || widget.config.city !== city) return;
    const weatherEl = el.querySelector('.w-clock-weather');
    if (!weatherEl) return;
    const newHTML = renderWeatherInfoHTML(city, info, info ? 'ok' : 'error');
    const tmp = document.createElement('div');
    tmp.innerHTML = newHTML;
    const newNode = tmp.firstElementChild;
    if (newNode) weatherEl.replaceWith(newNode);
  });
}
function renderWeatherInfoHTML(city, info, state) {
  if (state === 'empty' || !city) return `<span class="w-clock-weather" data-weather-state="empty">未设置城市</span>`;
  if (state === 'loading') return `<span class="w-clock-weather" data-weather-state="loading">${esc(city)} · 加载中…</span>`;
  if (state === 'error' || !info) return `<span class="w-clock-weather" data-weather-state="error">${esc(city)} · 获取失败</span>`;
  const c = weatherIconColor(info.code);
  return `<span class="w-clock-weather" data-weather-state="ok"><span class="wc-ico" style="color:${c}">${weatherIcon(info.code)}</span><span class="wc-txt">${esc(city)} ${weatherDesc(info.code)} ${info.temp}°</span></span>`;
}
function weatherDesc(code) {
  if (code === 0) return '晴';
  if (code <= 3) return '多云';
  if (code === 45 || code === 48) return '雾';
  if (code >= 51 && code <= 57) return '毛毛雨';
  if (code >= 61 && code <= 67) return '雨';
  if (code >= 71 && code <= 77) return '雪';
  if (code >= 80 && code <= 82) return '阵雨';
  if (code >= 85 && code <= 86) return '阵雪';
  if (code >= 95 && code <= 99) return '雷雨';
  return '未知';
}
function weatherIcon(code) {
  if (code === 0) return ICONS.sun;
  if (code <= 3) return ICONS.cloud;
  if (code >= 51) return ICONS.rain;
  return ICONS.cloud;
}
function weatherIconColor(code) {
  if (code === 0) return '#d4b868';
  if (code <= 3) return '#a8a8b0';
  if (code === 45 || code === 48) return '#a8a8b0';
  if (code >= 51 && code <= 57) return '#8a9bb5';
  if (code >= 61 && code <= 67) return '#8a9bb5';
  if (code >= 71 && code <= 77) return '#a8c8e0';
  if (code >= 80 && code <= 82) return '#8a9bb5';
  if (code >= 85 && code <= 86) return '#a8c8e0';
  if (code >= 95 && code <= 99) return '#b8a8d8';
  return '#a8a8b0';
}

async function doOnlineSearch(keyword) {
  if (!keyword) return;
  _onlineSearchKeyword = keyword;
  const listEl = $('#onlineTrackList');
  if (listEl) {
    listEl.innerHTML = `<div class="music-empty" style="padding:50px 30px;">搜索中…</div>`;
  }
  try {
    const url = `https://music-api.gdstudio.xyz/api.php?types=search&source=netease&name=${encodeURIComponent(keyword)}&count=30&pages=1`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('搜索请求失败');
    const data = await res.json();
        const arr = Array.isArray(data) ? data : (Array.isArray(data.data) ? data.data : []);
    
    // 使用 Promise.all 并发请求，如果 GD 没封面，用 iTunes 补全
    _onlineSearchResults = await Promise.all(arr.map(async item => {
      let pic = item.pic || item.album_image || null;
      
      if (!pic) {
        try {
          const iname = item.name || item.title || '';
          const iartist = Array.isArray(item.artist) ? item.artist.join(' ') : (item.artist || '');
          const keyword = iartist ? `${iname} ${iartist}` : iname;
          const itunesUrl = `https://itunes.apple.com/search?term=${encodeURIComponent(keyword)}&entity=song&limit=1`;
          const itRes = await fetch(itunesUrl);
          if (itRes.ok) {
            const itData = await itRes.json();
            if (itData.results && itData.results.length > 0) {
              // 将 100x100 替换为 300x300 获取更清晰的图
              pic = itData.results[0].artworkUrl100.replace('100x100bb', '300x300bb');
            }
          }
        } catch (_) {}
      }
      
      return {
        id: String(item.id || item.song_id || ''),
        name: item.name || item.title || '未知歌曲',
        artist: Array.isArray(item.artist) ? item.artist.join(' / ') : (item.artist || ''),
        album: item.album || '',
        duration: normalizeDuration(item), // ★ 使用新的解析逻辑
        album_image: pic, // 这里赋值补全后的图
        source: 'netease',
        raw: item
      };
    })).then(res => res.filter(t => t.id));
  } catch (e) {
    _onlineSearchResults = [];
    if (listEl) listEl.innerHTML = `<div class="music-empty" style="padding:50px 30px;">搜索失败：${esc(friendlyError(e))}</div>`;
    return;
  }
  renderOnlineSearchPage();
}

async function fetchOnlineLyric(track) {
  if (!track || !track.id) return null;
  try {
    const url = `https://music-api.gdstudio.xyz/api.php?types=lyric&source=netease&id=${encodeURIComponent(track.id)}`;
    const res = await fetch(url);
    if (!res.ok) return null;
    const data = await res.json();
    const raw = data.lyric || data.data?.lyric || data.lrc || data.data?.lrc || '';
    return raw || null;
  } catch (_) {
    return null;
  }
}

async function playOnlineTrack(track) {
  if (!track || !track.id) return;
  showLoadingToast('获取播放地址…');
  try {
    const url = `https://music-api.gdstudio.xyz/api.php?types=url&source=netease&id=${encodeURIComponent(track.id)}&br=320`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('获取播放地址失败');
    const data = await res.json();
    const playUrl = data.url || data.data?.url || '';
    if (!playUrl) throw new Error('该歌曲暂时无法播放');

    let lyricRaw = '';
    try { lyricRaw = await fetchOnlineLyric(track); } catch (_) {}

    hideLoadingToast();

    const existing = state.music.tracks.find(t => t.source === 'online' && t.url === playUrl);
    let trackId;
    if (existing) {
      trackId = existing.id;
      if (!existing.onlineId && track.id) {
        existing.onlineId = track.id;
        existing.onlineSource = track.source || 'netease';
        save();
      }
      if (!existing.lyrics && lyricRaw) {
        existing.lyrics = lyricRaw;
        const parsed = parseLRC(lyricRaw);
        existing.lyricsLines = parsed.lines;
        existing.lyricsHasTime = parsed.hasTime;
        save();
      }
      if (!existing.cover) {
        if (track.album_image) {
          existing.cover = track.album_image;
          save();
        } else {
          fetchOnlineCover(existing, true).catch(() => {});
        }
      }
    } else {
      trackId = uid('tr_');
      let lyrics = '', lyricsLines = null, lyricsHasTime = false;
      if (lyricRaw) {
        const parsed = parseLRC(lyricRaw);
        lyrics = lyricRaw;
        lyricsLines = parsed.lines;
        lyricsHasTime = parsed.hasTime;
      }
      state.music.tracks.push({
        id: trackId, name: track.name, artist: track.artist,
        album: track.album || '', duration: track.duration || 0,
        cover: track.album_image || null, bgImage: null, textMode: 'auto',
        source: 'online', blobKey: null, url: playUrl,
        onlineSource: track.source || 'netease', onlineId: track.id,
        lyrics, lyricsLines, lyricsHasTime, addedAt: Date.now()
      });
      save();
      
      if (!track.album_image) {
        const newTrack = state.music.tracks.find(t => t.id === trackId);
        if (newTrack) fetchOnlineCover(newTrack, true).catch(() => {});
      }
    }

    player.init();
    player.unlocked = true;
    player.setQueue([trackId], 0);
    await player.load(trackId, true);
    openPlayerPage('online-search');
  } catch (e) {
    hideLoadingToast();
    toast('播放失败：' + friendlyError(e));
  }
}

/* ============================================================
   在线匹配歌曲封面 (强力加强版：网易云 + iTunes 兜底)
   ============================================================ */
async function fetchOnlineCover(track, silent = false) {
  if (!track) return;
  const name = (track.name || '').trim();
  const artist = (track.artist || '').trim();
  if (!name) { if (!silent) toast('歌曲名不能为空'); return; }
  
  if (!silent) showLoadingToast('正在搜索封面…');
  try {
    let pic = null;
    
    // 1. 优先尝试网易云 (GD Studio 接口)
    try {
      const url = `https://music-api.gdstudio.xyz/api.php?types=search&source=netease&name=${encodeURIComponent(name)}&count=10&pages=1`;
      const res = await fetch(url);
      if (res.ok) {
        const data = await res.json();
        const arr = Array.isArray(data) ? data : (Array.isArray(data.data) ? data.data : []);
        if (arr.length) {
          let best = null;
          const tn = name.toLowerCase();
          const tartist = artist.toLowerCase();
          for (const item of arr) {
            const iname = (item.name || '').toLowerCase();
            const iartist = (item.artist && Array.isArray(item.artist) ? item.artist.join(' ') : (item.artist || '')).toLowerCase();
            
            // 名字要匹配上
            if (iname.includes(tn) || tn.includes(iname)) {
              // 如果歌手也对得上，那就是完美匹配
              if (!tartist || iartist.includes(tartist) || tartist.includes(iartist)) {
                best = item; break; 
              }
              if (!best) best = item; // 至少名字对上了，先备选
            }
          }
          if (!best) best = arr[0];
          
          // 深度检索可能包含图片的字段
          pic = best.pic || best.album_image || best.picUrl || (best.al && best.al.picUrl) || (best.album && best.album.picUrl);
          
          // 如果是网易云特有的 pic_id，尝试拼接
          if (!pic && best.pic_id) {
            pic = `https://p1.music.126.net/${best.pic_id}/${best.pic_id}.jpg`;
          }
        }
      }
    } catch (_) {}

    // 2. 如果网易云没拿到图，或者图是空字符串，使用 iTunes API 兜底 (极高成功率，无防盗链)
    if (!pic) {
      try {
        const keyword = artist ? `${name} ${artist}` : name;
        const itunesUrl = `https://itunes.apple.com/search?term=${encodeURIComponent(keyword)}&entity=song&limit=1`;
        const itRes = await fetch(itunesUrl);
        if (itRes.ok) {
          const itData = await itRes.json();
          if (itData.results && itData.results.length > 0 && itData.results[0].artworkUrl100) {
            // 把 100x100 替换为 600x600 获取高清图
            pic = itData.results[0].artworkUrl100.replace('100x100bb', '600x600bb');
          }
        }
      } catch (_) {}
    }

    if (!pic) throw new Error('所有渠道均未找到该歌曲封面');
    
    track.cover = pic;
    save();
    if (!silent) hideLoadingToast();
    
    if (!silent) {
      toast('封面已更新');
      if (musicSubView === 'player' && player.trackId === track.id) {
        renderMusicPlayerPage(); 
      } else if (musicSubView === 'library') {
        renderMusicLibrary();
      } else if (musicSubView === 'playlist') {
        renderMusicPlaylistPage();
      } else if (musicSubView === 'main') {
        renderMusicMain();
      }
    } else {
      // 静默更新时，如果是正在播放的这首歌，局部更新播放器盘面图
      if (musicSubView === 'player' && player.trackId === track.id) {
        const coverEl = document.querySelector('.music-disc-cover');
        if (coverEl) {
          coverEl.style.backgroundImage = `url('${pic}')`;
          coverEl.innerHTML = '';
        }
      }
    }
  } catch (e) {
    if (!silent) {
      hideLoadingToast();
      toast('获取封面失败：' + friendlyError(e));
    }
  }
}

async function importMusicFiles(files) {
  const valid = files.filter(f => {
    if (!f) return false;
    const isAudio = f.type.startsWith('audio/') || /\.(mp3|m4a|wav)$/i.test(f.name);
    return isAudio;
  });
  if (!valid.length) { toast('没有可导入的音频文件'); return; }
  showLoadingToast(`正在导入 0 / ${valid.length}…`);
  let added = 0, skipped = 0;
  for (let i = 0; i < valid.length; i++) {
    const f = valid[i];
    if (f.size > MUSIC_MAX_FILE_SIZE) { skipped++; continue; }
    if (f.size > MUSIC_WARN_FILE_SIZE) {
      if (!confirm(`「${f.name}」有 ${(f.size/1024/1024).toFixed(1)}MB，可能会占用较多存储。继续导入？`)) { skipped++; continue; }
    }
    try {
      const trackId = uid('tr_');
      await idbSetMusic(trackId, f);
      const duration = await getAudioDuration(f);
      const name = f.name.replace(/\.[^.]+$/, '').trim() || '未命名';
      state.music.tracks.push({
        id: trackId,
        name,
        artist: '',
        album: '',
        duration,
        cover: null,
        bgImage: null,
        textMode: 'auto',
        source: 'local',
        blobKey: trackId,
        url: null,
        lyrics: '',
        lyricsLines: null,
        lyricsHasTime: false,
        addedAt: Date.now()
      });
      added++;
    } catch (err) { skipped++; }
    showLoadingToast(`正在导入 ${i + 1} / ${valid.length}…`);
    await new Promise(r => setTimeout(r, 30));
  }
  hideLoadingToast();
  save();
  if (added) toast(`成功导入 ${added} 首${skipped ? `，跳过 ${skipped} 首` : ''}`);
  else toast(skipped ? `全部跳过（可能超过 100MB 或格式不支持）` : '没有导入');
  if (musicSubView === 'library') renderMusicLibrary();
  else if (musicSubView === 'main') renderMusicMain();
}

async function importMusicFromUrls() {
  const modal = $('#fontUrlModal');
  modal.innerHTML = `
    <div class="widget-panel">
      <h3 class="edit-title">导入在线链接</h3>
      <textarea class="edit-textarea" id="musicUrlInput" placeholder="粘贴音频直链，每行一个&#10;https://example.com/song.mp3" style="min-height:140px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;"></textarea>
      <p class="hint">支持 .mp3 / .m4a / .wav 等音频直链。同链接只保留一份。https 页面只能播放 https 链接。</p>
      <div class="edit-actions">
        <button class="edit-cancel" id="musicUrlCancel" type="button">取消</button>
        <button class="edit-save" id="musicUrlConfirm" type="button">导入</button>
      </div>
    </div>`;
  modal.classList.add('show');
  setTimeout(() => { const i = $('#musicUrlInput'); if (i) i.focus(); }, 240);
  const close = () => { modal.classList.remove('show'); modal.innerHTML = ''; };
  modal.onclick = (e) => { if (e.target.id === 'fontUrlModal') close(); };
  $('#musicUrlCancel').onclick = close;
  $('#musicUrlConfirm').onclick = async () => {
    const text = $('#musicUrlInput').value;
    const urls = text.split('\n').map(s => s.trim()).filter(s => /^https?:\/\//i.test(s));
    if (!urls.length) { toast('请粘贴有效的链接'); return; }
    close();
    await processUrlImports(urls);
  };
}
async function processUrlImports(urls) {
  const existing = new Set(state.music.tracks.filter(t => t.source === 'url' && t.url).map(t => t.url));
  showLoadingToast(`正在导入 0 / ${urls.length}…`);
  let added = 0, skipped = 0, dup = 0;
  for (let i = 0; i < urls.length; i++) {
    const url = urls[i];
    if (existing.has(url)) { dup++; }
    else {
      const dur = await getAudioDurationFromUrl(url);
      if (!dur) { skipped++; }
      else {
        const name = extractNameFromUrl(url);
        state.music.tracks.push({
          id: uid('tr_'),
          name,
          artist: '',
          album: '',
          duration: dur,
          cover: null,
          bgImage: null,
          textMode: 'auto',
          source: 'url',
          blobKey: null,
          url,
          lyrics: '',
          lyricsLines: null,
          lyricsHasTime: false,
          addedAt: Date.now()
        });
        existing.add(url);
        added++;
      }
    }
    showLoadingToast(`正在导入 ${i + 1} / ${urls.length}…`);
    await new Promise(r => setTimeout(r, 20));
  }
  hideLoadingToast();
  save();
  const parts = [];
  if (added) parts.push(`成功 ${added} 首`);
  if (dup) parts.push(`重复 ${dup} 首`);
  if (skipped) parts.push(`跳过 ${skipped} 首`);
  toast(parts.join(' · ') || '没有导入');
  if (musicSubView === 'library') renderMusicLibrary();
  else if (musicSubView === 'main') renderMusicMain();
}

  const isFav = musicActivePlaylistId === '__favorites__';
  let title, cover, trackIds;

function parseLRC(text) {
  const lines = String(text || '').split('\n');
  const timed = [];
  const untimed = [];
  const re = /\[(\d{1,2}):(\d{1,2})(?:[.:](\d{1,3}))?\]/g;
  const metaRe = /^\s*\[(ti|ar|al|by|offset|re|ve|length):/i;
  for (const line of lines) {
    if (metaRe.test(line)) continue;
    const times = [];
    let lastIndex = 0;
    let m;
    re.lastIndex = 0;
    while ((m = re.exec(line)) !== null) {
      const mm = parseInt(m[1], 10);
      const ss = parseInt(m[2], 10);
      const frac = m[3] ? parseInt(m[3].padEnd(3, '0').slice(0, 3), 10) : 0;
      times.push(mm * 60 + ss + frac / 1000);
      lastIndex = re.lastIndex;
    }
    if (times.length) {
      const txt = line.slice(lastIndex).trim();
      if (txt) times.forEach(tm => timed.push({ time: tm, text: txt }));
    } else {
      const txt = line.trim();
      if (txt) untimed.push(txt);
    }
  }
  if (timed.length) {
    timed.sort((a, b) => a.time - b.time);
    return { lines: timed, hasTime: true };
  }
  return { lines: untimed.map(t => ({ time: null, text: t })), hasTime: false };
}
